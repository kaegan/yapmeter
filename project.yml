name: Yapmeter
options:
  bundleIdPrefix: fyi.kaegan
  deploymentTarget:
    macOS: "14.2"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  Yapmeter:
    type: application
    platform: macOS
    sources:
      - path: Yapmeter
        excludes:
          - Info.plist
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.kaegan.yapmeter
        PRODUCT_NAME: Yapmeter
        INFOPLIST_FILE: Yapmeter/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "14.2"
  YapmeterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - YapmeterTests
    dependencies:
      - target: Yapmeter
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.2"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fyi.kaegan.yapmeter.tests
        CODE_SIGN_STYLE: Automatic
schemes:
  Yapmeter:
    build:
      targets:
        Yapmeter: all
        YapmeterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YapmeterTests
