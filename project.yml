name: Yapmeter
options:
  bundleIdPrefix: fyi.kaegan
  deploymentTarget:
    macOS: "14.2"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  Yapmeter:
    type: application
    platform: macOS
    sources:
      - path: Yapmeter
        excludes:
          - Info.plist
          - Yapmeter.entitlements
    # The hardened runtime refuses the microphone to an app that doesn't
    # declare com.apple.security.device.audio-input, whatever the toggle
    # in System Settings says. Debug builds are signed ad hoc without the
    # hardened runtime and never needed it; the notarized release does
    # (v0.1.2 shipped without it, YB-42). The sandbox stays off; this is
    # the hardened-runtime key, not the sandbox one.
    #
    # xcodegen rewrites the file at `path` from `properties` on every
    # generate, so the entitlement lives here, not in the plist. Editing
    # the plist by hand is undone by the next build.
    entitlements:
      path: Yapmeter/Yapmeter.entitlements
      properties:
        com.apple.security.device.audio-input: true
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fyi.kaegan.yapmeter
        PRODUCT_NAME: Yapmeter
        INFOPLIST_FILE: Yapmeter/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "14.2"
  YapmeterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - YapmeterTests
    dependencies:
      - target: Yapmeter
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.2"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fyi.kaegan.yapmeter.tests
        CODE_SIGN_STYLE: Automatic
schemes:
  Yapmeter:
    build:
      targets:
        Yapmeter: all
        YapmeterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YapmeterTests
