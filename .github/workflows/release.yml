name: Release

# Push a tag to ship: `git tag v0.2.0 && git push origin v0.2.0`.
# The tag is the only place the marketing version is written down — the build
# number comes from the commit count, so it always increases and Sparkle can
# always tell an update from a downgrade.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          # rev-list --count needs the whole history, not the default shallow
          # clone, or every release would claim to be build 1.
          fetch-depth: 0

      - name: Work out the version numbers
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD="$(git rev-list --count HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION (build $BUILD)"

      - name: Refuse to ship the placeholder signing key
        run: |
          # An update signed against a key nobody holds is an app that can
          # never be updated again. Fail here rather than at the user's Mac.
          if grep -q REPLACE_WITH_SPARKLE_PUBLIC_ED_KEY Yapmeter/Info.plist; then
            echo "::error::SUPublicEDKey is still the placeholder. Run generate_keys and put the public key in Yapmeter/Info.plist."
            exit 1
          fi

      - name: Check the release secrets are actually set
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_P12_PASSWORD: ${{ secrets.CERTIFICATE_P12_PASSWORD }}
        run: |
          # An empty secret looks exactly like a set one in the UI, and
          # `gh secret set X < missing-file` stores an empty string while
          # still printing a tick. Notarization is fifteen minutes into the
          # job and signing is later still, so check the whole set up front
          # rather than finding out after the archive has been built.
          MISSING=""
          for NAME in APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD \
                      SPARKLE_PRIVATE_KEY CERTIFICATE_P12_BASE64 \
                      CERTIFICATE_P12_PASSWORD; do
            [ -n "${!NAME}" ] || MISSING="$MISSING $NAME"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Empty or unset repository secrets:$MISSING — re-set each with 'gh secret set NAME'."
            exit 1
          fi
          # A password copied out of a browser often brings a space or a
          # newline with it. GitHub masks the secret in the log but not the
          # stray character in front of it, so the giveaway is an env line
          # with one space too many — which is exactly how the second v0.1.0
          # attempt failed. None of these secrets can legitimately contain
          # whitespace, so this is an error rather than a guess.
          for NAME in APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            # Compared against its own stripped form rather than grepped:
            # grep never sees a trailing newline, because that newline is
            # what ends the line it would have to match inside.
            if [ "$(printf '%s' "${!NAME}" | tr -d '[:space:]')" != "${!NAME}" ]; then
              echo "::error::$NAME has whitespace in it. Re-set it stripped, e.g. 'pbpaste | tr -d \"[:space:]\" | gh secret set $NAME'."
              exit 1
            fi
          done
          # Apple issues app-specific passwords as four groups of four lower
          # case letters. A warning rather than an error because the shape is
          # Apple's to change, but nine times in ten a password that fails
          # this is the Apple ID password pasted in by mistake, and that costs
          # a whole build to discover at the notary.
          if ! printf '%s' "$APPLE_APP_SPECIFIC_PASSWORD" | grep -Eq '^[a-z]{4}(-[a-z]{4}){3}$'; then
            echo "::warning::APPLE_APP_SPECIFIC_PASSWORD is not in Apple's xxxx-xxxx-xxxx-xxxx shape. It must be an app-specific password from appleid.apple.com, not your Apple ID password."
          fi

      - name: Select Xcode 26
        # The word witness (YB-53) calls SpeechAnalyzer, which only exists in
        # the macOS 26 SDK, and the app deploys to macOS 26 (YB-67), so the
        # toolchain has to be new enough to compile it. Picked by version rather
        # than pinned to one app name: the runner image renames it on every
        # point release, and its default Xcode has lagged its newest before.
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install XcodeGen and dmgbuild
        run: |
          brew install xcodegen
          # dmgbuild lays out the installer's Finder window by writing the
          # volume's .DS_Store itself, which is what lets scripts/make-dmg.sh
          # run on a runner with no Finder session to drive. pipx, because
          # the runner's python is Homebrew's and refuses a bare pip install.
          pipx install dmgbuild

      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_P12_PASSWORD: ${{ secrets.CERTIFICATE_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          # The keychain is thrown away with the runner, so its password only
          # has to be unguessable for the length of this job.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          # A pipeline like `base64 -i missing.p12 | gh secret set ...` stores
          # an empty secret and still prints a tick, so an empty or absurdly
          # small certificate is the likeliest thing to be wrong here.
          if [ ! -s "$RUNNER_TEMP/certificate.p12" ] || [ "$(stat -f%z "$RUNNER_TEMP/certificate.p12")" -lt 1000 ]; then
            echo "::error::CERTIFICATE_P12_BASE64 decoded to nothing usable. Re-set it from a .p12 your shell can actually read."
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Test
        run: |
          xcodebuild test \
            -project Yapmeter.xcodeproj \
            -scheme Yapmeter \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project Yapmeter.xcodeproj \
            -scheme Yapmeter \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -archivePath "$RUNNER_TEMP/Yapmeter.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Export the app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Export rather than reaching into the archive by hand: Sparkle
          # nests a framework, an XPC service and two helper apps inside the
          # bundle, and each has to be signed inside-out or notarization
          # rejects the lot.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Yapmeter.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Check the app can open the microphone
        run: |
          # The hardened runtime refuses the microphone to an app without
          # this entitlement, silently and whatever System Settings shows.
          # v0.1.2 shipped that way (YB-42): the far end worked, the turn
          # timer never ran. Debug builds are signed ad hoc without the
          # hardened runtime, so only a release build can catch it.
          APP="$RUNNER_TEMP/export/Yapmeter.app"
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/entitlements.plist"
          cat "$RUNNER_TEMP/entitlements.plist"
          if [ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' "$RUNNER_TEMP/entitlements.plist" 2>/dev/null)" != "true" ]; then
            echo "::error::Yapmeter.app is missing the com.apple.security.device.audio-input entitlement, so the microphone would be refused. Check Yapmeter/Yapmeter.entitlements is wired up in project.yml."
            exit 1
          fi

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          APP="$RUNNER_TEMP/export/Yapmeter.app"
          # Notarization takes a zip; the staple goes back onto the .app, so
          # this archive is a throwaway and the distributed one is zipped
          # again afterwards.
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$APP"
          # Proves the result is what a user's Mac will see: stapled, signed
          # by a Developer ID, and accepted by Gatekeeper offline.
          spctl --assess --type execute --verbose "$APP"

      - name: Zip for distribution
        id: package
        run: |
          # Named without the version on purpose. The tag already makes the
          # download URL unique per release, and a fixed name is what keeps
          # the appcast URL and the site's link stable across releases. The
          # zip is what Sparkle downloads; people get the disk image below.
          ZIP="$RUNNER_TEMP/Yapmeter.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Yapmeter.app" "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "length=$(stat -f%z "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Build the installer image
        id: dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # The download people click: the app on the left, Applications on
          # the right, an arrow between them. Built from the stapled app, so
          # the copy inside is already accepted offline; the image itself
          # is signed and notarized as well so Gatekeeper trusts it before
          # anything is dragged out of it. Same fixed name as the zip, for
          # yapmeter.com's /releases/latest/download/Yapmeter.dmg link.
          DMG="$RUNNER_TEMP/Yapmeter.dmg"
          scripts/make-dmg.sh "$RUNNER_TEMP/export/Yapmeter.app" "$DMG"
          codesign --sign "Developer ID Application" --timestamp "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose "$DMG"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Sign the archive for Sparkle
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SIGN_UPDATE="$(find build/DerivedData/SourcePackages/artifacts -name sign_update -not -path '*old_dsa*' | head -1)"
          # The tool ships inside the resolved Sparkle package, so it only
          # exists because the archive above used this derived data path.
          if [ -z "$SIGN_UPDATE" ]; then
            echo "::error::sign_update not found under build/DerivedData/SourcePackages/artifacts."
            exit 1
          fi
          # --ed-key-file - reads the key from stdin. Sparkle removed the
          # option that took it as an argument, and stdin is the better shape
          # anyway: the key never lands on the runner's disk or in its argv.
          SIGNATURE="$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - -p "${{ steps.package.outputs.zip }}")"
          if [ -z "$SIGNATURE" ]; then
            echo "::error::sign_update produced no signature."
            exit 1
          fi
          # The signature is not a secret — it is published in the appcast —
          # but the key it came from must never reach the log.
          echo "signature=$SIGNATURE" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create it now, before the appcast is built, because the appcast
          # embeds the release notes and they live on the release. A release
          # made by hand ahead of the tag keeps its own notes.
          #
          # The notes are written by scripts/release_notes.py rather than
          # --generate-notes: they show up in Sparkle's update dialog, where
          # a list of PR titles with links is noise. Only PRs labelled
          # `enhancement` or `bug` appear, under "New features" and "Bug
          # fixes"; everything else is left out.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            python3 scripts/release_notes.py \
              --repo "${{ github.repository }}" \
              --tag "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$GITHUB_REF_NAME" \
              --title "${{ steps.version.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Update the appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # The live feed is the source of truth for what has already shipped,
          # so past releases survive without anything being committed back to
          # the repo. A first release starts from an empty feed.
          if ! curl -fsSL https://yapmeter.com/appcast.xml -o "$RUNNER_TEMP/appcast.xml"; then
            : > "$RUNNER_TEMP/appcast.xml"
            # Starting fresh is right for the first release and wrong for
            # every one after it: the new feed would list this version alone
            # and every shipped release would vanish from it. The failure is
            # invisible either way, so say which case this is. A warning
            # rather than an error because the feed that comes out still
            # updates users correctly — it is the history that is lost.
            if [ "$(gh release list --limit 2 --json tagName -q '. | length')" -gt 1 ]; then
              echo "::warning::https://yapmeter.com/appcast.xml could not be fetched, so the feed was rebuilt from this release alone and earlier versions have been dropped from it. Check the site rewrite and that release assets are publicly readable."
            fi
          fi
          gh release view "$GITHUB_REF_NAME" --json body -q .body > "$RUNNER_TEMP/notes.md"
          python3 scripts/appcast.py \
            --appcast "$RUNNER_TEMP/appcast.xml" \
            --version "$VERSION" \
            --build "${{ steps.version.outputs.build }}" \
            --url "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/Yapmeter.zip" \
            --length "${{ steps.package.outputs.length }}" \
            --signature "${{ steps.sign.outputs.signature }}" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Upload the app and the appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # All three land on the same release: the disk image is what the
          # site's download button fetches, the zip is what the appcast
          # points at, and the appcast is what yapmeter.com serves as the feed.
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.dmg.outputs.dmg }}" \
            "${{ steps.package.outputs.zip }}" \
            "$RUNNER_TEMP/appcast.xml" \
            --clobber
