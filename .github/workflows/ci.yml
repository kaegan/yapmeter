name: CI

# Every pull request builds and runs the tests on a Mac, so a change is
# verified before anyone reads it. Pushes to main run the same job so the
# branch always has a known-good build to release from.
on:
  pull_request:
    # `edited` is what re-runs ticket-link after the description is fixed;
    # without it a PR whose body was corrected after opening stays red.
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        # The word witness (YB-53) calls SpeechAnalyzer, which only exists in
        # the macOS 26 SDK. `@available(macOS 26, *)` is a runtime gate; it
        # doesn't conjure the types into an older SDK, so the toolchain has to
        # be new enough to compile the file at all. Picked by version rather
        # than pinned to one app name: the runner image renames it on every
        # point release, and its default Xcode has lagged its newest before.
        run: |
          latest=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Test
        run: |
          xcodebuild test \
            -project Yapmeter.xcodeproj \
            -scheme Yapmeter \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

  ticket-link:
    # The Notion backlog links a PR to its ticket through a magic-word line
    # in the description ("close YAP-12" or "ref YAP-12"). Nothing else links
    # them, so a PR without one silently leaves the ticket behind.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check the description names a backlog ticket
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -Eiq '\b(close[sd]?|fix(e[sd])?|resolve[sd]?|ref[s]?)[[:space:]]+YAP-[0-9]+\b'; then
            echo "Ticket link found."
          else
            echo "::error::Add a line like 'close YAP-12' or 'ref YAP-12' to the PR description so Notion links it to the backlog ticket."
            exit 1
          fi
